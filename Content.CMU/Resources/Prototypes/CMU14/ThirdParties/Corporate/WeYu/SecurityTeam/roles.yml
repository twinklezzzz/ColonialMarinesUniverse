# WY Corporate Security Team: an off-site Corporate Security detail sent in to reinforce a site's own
# guards, in the same uniform and kit. Called in through the corporate affairs console.

- type: job
  parent: CMJobBase
  id: CMUJobWYSecurityTeamSergeant
  roundSide: ThirdParty
  roundForce: WY
  roundRole: WYSecurityTeamSergeant
  roundComponents:
  - type: RegulationAppearance # third-party security keeps a regulation look
  - type: NpcFactionMember
    factions:
    - AUWeYu
  - type: Skills
    skills:
      RMCSkillOverwatch: 1
      RMCSkillFirearms: 2
      RMCSkillCqc: 2
      RMCSkillEndurance: 2
      RMCSkillFireman: 2
      RMCSkillEngineer: 2
      RMCSkillIntel: 1
      RMCSkillVehicles: 1
      RMCSkillPolice: 2
      RMCSkillConstruction: 2
      RMCSkillLeadership: 1
  - type: JobPrefix
    prefix: cmu-job-prefix-corporate-security-sergeant
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/cm_job_icons.rsi
      state: weya_goon_lead
  name: cmu-wysecteam-name-sergeant
  description: cmu-wysecteam-description-sergeant
  playTimeTracker: CMUJobWYSecurityTeamSergeant
  ranks:
    CMURankWYSecSergeant: []
  startingGear: CMUGearWYSecurityTeamSergeant
  spawnMenuRoleName: WY Security Team Sergeant (3rd party)
  greeting: cmu-wysecteam-greeting
  icon: "RMCJobIconPMCGoonLead"
  joinNotifyCrew: false
  supervisors: au14-job-supervisors-wy
  accessGroups:
  - CMUWYSecurity
  - AUPrisonStaff
  access:
  - CMUAccessWYArmory
  hidden: false

- type: playTimeTracker
  id: CMUJobWYSecurityTeamSergeant

- type: entity
  parent: AU14BaseMobSpeciesOrganicWeYu
  id: CMUJobWYSecurityTeamSergeant
  name: WY Security Team Sergeant (3rd party)
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: CMUSquadWYSecurity
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: cmu-wysecteam-name-sergeant
    description: cmu-wysecteam-description-sergeant
    reregister: false
    job: CMUJobWYSecurityTeamSergeant
    raffle:
      settings: short
    rules: cmu-wysecteam-rules

