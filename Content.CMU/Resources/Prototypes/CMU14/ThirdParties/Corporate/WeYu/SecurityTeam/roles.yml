# The team's own kit, so the round-start guards are untouched: the Kutjevo security uniform (lead variant
# for the Sergeant), the M77 holster
# rig on the belt, an NSG-23 rifle in suit storage, and the taser, baton and cuffs in the satchel.
- type: startingGear
  id: CMUGearWYSecurityTeamOfficer
  equipment:
    id: AU14IDCardWYGuard
    outerClothing: CMUArmorM4PMCCorporate
    jumpsuit: RMCJumpsuitVeteranPMCKutjevo
    shoes: RMCBootsPMCFilled
    head: AU14CivBallCapBlack
    belt: RMCM77BeltPMCFilled
    back: RMCSatchelLightpackBlack
    ears: RMCHeadsetDistressWeYa
    ears2: RMCM5CameraGear
    suitstorage: RMCWeaponRifleSSG45
    pocket1: RMCPouchMagazineLargePMC
    pocket2: AU14PouchIFAKFill
  storage:
    pocket1:
    - RMCMagazineRifleSSG45
    - RMCMagazineRifleSSG45
    - RMCMagazineRifleSSG45
    - RMCMagazineRifleSSG45
    back:
    - RMCWeaponTaser
    - CMStunbaton
    - RMCHandcuffs
    - RMCHandcuffs
    - RMCHandcuffs
    - CMU14TearGasGrenade
    - RMCGrenadeFlashBang
    - RMCMREWeYa
    - CMUGuidebookSecurityHandbook

- type: startingGear
  parent: CMUGearWYSecurityTeamOfficer
  id: CMUGearWYSecurityTeamSergeant
  equipment:
    id: CMUIDCardWYSecuritySergeant
    outerClothing: CMUArmorM4PMCCorporateLead
    jumpsuit: RMCJumpsuitVeteranPMCKutjevoLead

