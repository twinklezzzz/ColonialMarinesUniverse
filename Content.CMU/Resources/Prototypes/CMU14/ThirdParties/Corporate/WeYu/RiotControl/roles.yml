    squad: CMUSquadWYSecurity
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: cmu-wyriot-name-specialist
    description: cmu-wyriot-description-specialist
    reregister: false
    job: CMUJobWYRiotSpecialist
    raffle:
      settings: short
    rules: cmu-wyriot-rules

# The specialists' kit: WY PMC armour with greaves, kneepads, shoulder pads and vambraces, an RC6
# riot helmet with the riot visor, a gas mask with a WY filter against their own tear gas, a beanbag riot shotgun, a telescopic baton and the
# usual crowd-control grenades.
- type: startingGear
  id: CMUGearWYRiotSpecialist
  equipment:
    id: AU14IDCardColonyCorporateLiaison
    outerClothing: AU14WYPMCArmor
    jumpsuit: AU14WYPMCFatigues
    shoes: RMCBootsPMCFilled
    head: CMUArmorHelmetPMCRiotFilled
    mask: CMUMaskGasWYFilled
    gloves: AU14PVEHandsInsulatedBlackMarine
    belt: RMCMK80BeltPMCFilled
    pocket1: RMCPouchShotgun
    pocket2: AU14PouchIFAKFill
    back: RMCSatchelLightpackWeYa
    ears: RMCHeadsetDistressWeYa
    suitstorage: CMUWeaponShotgunM890RiotFilled
  storage:
    outerClothing:
    - CMUHelmetGarbPMCGreaves
    - CMUHelmetGarbPMCKneepads
    - CMUHelmetGarbPMCPads
    - CMUHelmetGarbPMCBraces
    pocket1:
    - CMShellShotgunBeanbag
    - CMShellShotgunBeanbag
    - CMShellShotgunBeanbag
    - CMShellShotgunBeanbag
    back:
    - AU14TeleBaton
    - RMCZipties
    - RMCZipties
    - CMU14TearGasGrenade
    - CMU14TearGasGrenade
    - RMCGrenadeFlashBang
    - RMCGrenadeFlashBang
    - RMCMREWeYaPMC

# The leader trades the shotgun for an M63 with rubber rounds.
- type: startingGear
  parent: CMUGearWYRiotSpecialist
  id: CMUGearWYRiotLeader
  equipment:
    suitstorage: RMCWeaponSMGM63B2
    pocket1: RMCPouchMagazineLarge
  storage:
    outerClothing:
    - CMUHelmetGarbPMCGreaves
    - CMUHelmetGarbPMCKneepads
    - CMUHelmetGarbPMCPads
    - CMUHelmetGarbPMCBraces
    pocket1:
    - RMCMagazineSMGM63Rubber
    - RMCMagazineSMGM63Rubber
    - RMCMagazineSMGM63Rubber
    - RMCMagazineSMGM63Rubber
    back:
    - AU14TeleBaton
    - RMCZipties
    - RMCZipties
    - CMU14TearGasGrenade
    - CMU14TearGasGrenade
    - RMCGrenadeFlashBang
    - RMCGrenadeFlashBang
    - RMCMREWeYaPMC

# The MK221 riot shotgun comes empty; this one is loaded with eight beanbag shells.
- type: entity
  parent: RMCWeaponShotgunM890Riot
  id: CMUWeaponShotgunM890RiotFilled
  suffix: Filled, Beanbag
  components:
  - type: BallisticAmmoProvider
    cycleable: false
    whitelist:
      tags:
      - RMCShellShotgunBeanbag
    capacity: 8
    proto: CMShellShotgunBeanbag

# The RC6 riot helmet with the riot visor fitted instead of its own face shield.
- type: entity
  parent: ArmorHelmetPMCRiot
  id: CMUArmorHelmetPMCRiotFilled
  suffix: Shield, Visor
  components:
  - type: StorageFill
    contents:
    - id: AU14HelmetGarbRiotVisor

# A gas mask with a WY X-16 filter already fitted.
- type: entity
  parent: CMUMaskGas
  id: CMUMaskGasWYFilled
  suffix: WY filter
  components:
  - type: ItemSlots
    slots:
      filter:
        name: filter
        startingItem: CMUGasMaskFilterWY
        insertSound: /Audio/Items/screwdriver.ogg
        ejectSound: /Audio/Items/screwdriver.ogg
        whitelist:
          tags:
          - CMUGasMaskFilter

