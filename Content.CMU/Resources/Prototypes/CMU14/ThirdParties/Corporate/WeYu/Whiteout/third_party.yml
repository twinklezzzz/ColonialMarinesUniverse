# Whiteout: Weyland-Yutani's combat synthetic cleanup team. Admin-only - the player and ghost
# thresholds can't be met in a real round, so it only arrives when game staff call it.
- type: partySpawn
  id: WYPMCWhiteoutSpawn
  leadersToSpawn:
    CMUJobPMCWhiteoutLeader: 1
  gruntsToSpawn:
    CMUJobPMCWhiteout: 2
    CMUJobPMCWhiteoutGunner: 1
  scalewithpop: false
  spawnTogether: true

- type: thirdParty
  id: WYPMCWhiteout
  announceAsSurvivors: true
  partyspawn: WYPMCWhiteoutSpawn
  entrymethod: shuttle
  dropshippath: /Maps/CMU14/Vehicles/Dropships/rmc_ert_pmc_shuttle.yml
  weight: 1
  minplayers: 500
  maxplayers: 600
  ghostsNeeded: 600
  roundstart: false
