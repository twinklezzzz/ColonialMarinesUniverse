- type: job
  parent: CMJobBase
  id: CMUJobPMCWhiteout
  chevrons:
    CMURankWYCommando:
      entity: CMUChevronWYCommando
      requirements: []
  roundSide: ThirdParty
  roundForce: WY
  roundRole: PMCWhiteout
  roundComponents:
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: whiteout
  - type: Skills
    skills:
      RMCSkillCqc: 5
      RMCSkillEndurance: 5
      RMCSkillEngineer: 4
      RMCSkillConstruction: 3
      RMCSkillFirearms: 3
      RMCSkillOverwatch: 1
      RMCSkillMedical: 4
      RMCSkillSurgery: 3
      RMCSkillResearch: 1
      RMCSkillMeleeWeapons: 2
      RMCSkillPilot: 2
      RMCSkillPolice: 2
      RMCSkillFireman: 5
      RMCSkillPowerLoader: 2
      RMCSkillVehicles: 3
      RMCSkillJtac: 4
      RMCSkillIntel: 2
      RMCSkillDomestics: 2
      RMCSkillNavigations: 1
      RMCSkillExecution: 1
      RMCSkillSmartGun: 1
  - type: JobPrefix
    prefix: cmu-whiteout-prefix
  - type: NpcFactionMember
    factions:
    - AUWeYu
  - type: Language
    preset: AU14LanguagePresetSynth
  - type: LanguageLearning
    preset: AU14LanguageLearningPresetSynth
  - type: MeleeWeapon
    soundHit:
      path: /Audio/_RMC14/Weapons/synthpunch1.ogg
      params:
        variation: 0.15
        volume: -1
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 35
  - type: Synth
    canUseGuns: true
  - type: CMArmor
    immuneToAP: true
  - type: PyroWhitelist
  name: cmu-job-title-whiteout
  description: cmu-whiteout-description
  playTimeTracker: CMUJobPMCWhiteout
  requirements:
  - !type:TotalDepartmentsTimeRequirement
    group: CMUDepartmentsMilitary
    time: 18000 # 5 hours
  ranks:
    CMURankWYCommando: []
  startingGear: CMUGearPMCWhiteout
  spawnMenuRoleName: WY Whiteout Operative (event)
  greeting: cmu-whiteout-greeting
  icon: RMCJobIconPMCWhiteout
  joinNotifyCrew: false
  supervisors: cmu-whiteout-leader
  accessGroups:
  - CMUWYCommand
  hidden: false

- type: entity
  parent: AU14BaseMobSpeciesOrganicWeYu
  id: CMUJobPMCWhiteout
  name: WY Whiteout Operative
  components:
  # Synths don't scream and keep their callsign instead of a random human name.
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: EmoteOnDamage
    emoteChance: 0
  - type: GhostTakeoverAvailable
  - type: RandomMetadata
    nameSegments:
    - RMCNamesGreek
    - RMCNamesNumbers
    nameFormat: name-format-ert
  - type: GhostRoleApplySpecial
    squad: CMUSquadWYSecurity
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: cmu-whiteout-name
    description: cmu-whiteout-description
    reregister: false
    job: CMUJobPMCWhiteout
    raffle:
      settings: short
    rules: cmu-whiteout-rules

- type: startingGear
  id: CMUGearPMCWhiteout
  equipment:
    id: CMUIDCardPMCWhiteout
    jumpsuit: RMCJumpsuitVeteranPMCCommando
    outerClothing: CMArmorM4PMCCommando
    gloves: RMCHandsVeteranPMCCommando
    head: ArmorHelmetPMCCommando
    shoes: RMCBootsPMCCommandoFilled
    mask: RMCMaskCoifPMC
    ears: RMCHeadsetDistressPMC
    back: RMCSatchelPMC
    belt: RMCWeaponFL3FlamerWhiteout
    pocket1: RMCPouchMagazineLargePMC
    pocket2: RMCPouchMagazineLargePMC
    suitstorage: CMUWeaponRifleM54C2WhiteoutStandard
  storage:
    back:
    - RMCExplosivePlastic
    - RMCExplosivePlastic
    - RMCExplosiveBreachingCharge
    - RMCExplosiveBreachingCharge
    - CMCrowbar
    - RMCTankFlamerFL3Whiteout
    - RMCTankFlamerFL3Whiteout
    outerClothing:
    - CMMagazineRifleM54C
    - CMMagazineRifleM54C
    pocket1:
    - CMMagazineRifleM54C
    - CMMagazineRifleM54C
    - CMMagazineRifleM54C
    - CMMagazineRifleM54C
    pocket2:
    - CMMagazineRifleM54C
    - CMMagazineRifleM54C
    - CMMagazineRifleM54C
    - CMMagazineRifleM54C

- type: playTimeTracker
  id: CMUJobPMCWhiteout

# Whiteout M41A loaded with standard rounds instead of HEAP.
- type: entity
  parent: RMCWeaponRifleM54C2Whiteout
  id: CMUWeaponRifleM54C2WhiteoutStandard
  suffix: Standard ammo
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CMMagazineRifleM54C
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMMagazineRifleM54C
          - CMMagazineRifleM54CAP
          - CMMagazineRifleM54CExt
          - RMCMagazineRifleM54CIncendiary
          - RMCMagazineRifleM54CHEAP
