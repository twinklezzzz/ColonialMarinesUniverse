# WY Biohazard Containment Unit: PMC Dispatch's sterilisation crew, called in through the corporate affairs
# console when a site has a contamination it can't hold. Where Hazard Transport moves a hazard, this unit
# destroys it: sealed WY bio suits, two incinerator operators, a containment technician and a medic.

- type: job
  parent: CMJobBase
  id: CMUJobWYBioLeader
  chevrons:
    CMURankWYPMCTeamLeader:
      entity: CMUChevronWYPMCTeamLeader
      requirements: []
  roundSide: ThirdParty
  roundForce: WY
  roundRole: WYBioLeader
  roundComponents:
  - type: RegulationAppearance # third-party teams keep a regulation look
  - type: NpcFactionMember
    factions:
    - AUWeYu
  - type: Skills
    skills:
      RMCSkillEndurance: 3
      RMCSkillFirearms: 2
      RMCSkillCqc: 2
      RMCSkillFireman: 2
      RMCSkillPolice: 1
      RMCSkillLeadership: 2
      RMCSkillMedical: 2
      RMCSkillResearch: 1
  - type: MarineOrders
  - type: JobPrefix
    prefix: cmu-wybio-prefix-leader
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: pmc_ld
  name: cmu-wybio-name-leader
  description: cmu-wybio-description-leader
  playTimeTracker: CMUJobWYBioLeader
  ranks:
    CMURankWYPMCTeamLeader: []
  startingGear: CMUGearWYBioLeader
  spawnMenuRoleName: WY Containment Team Leader (3rd party)
  greeting: cmu-wybio-greeting
  icon: "RMCJobIconPMCLeader"
  joinNotifyCrew: false
  supervisors: au14-job-supervisors-wy
  accessGroups:
  - CMUWYSecurity
  - AUPrisonStaff
  access:
  - CMUAccessWYResearch
  - CMUAccessWYArmory
