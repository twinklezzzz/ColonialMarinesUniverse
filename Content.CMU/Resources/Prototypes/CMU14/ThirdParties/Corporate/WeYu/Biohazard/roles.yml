# The WY bio suit, with suit storage for a weapon and the unit's tools.
- type: entity
  parent: RMCSuitBioWeYa
  id: CMUSuitBioWeYaContainment
  name: WeYu-TSS MK I - containment suit
  description: The Weyland-Yutani TerraScientia bio-suit, refitted for PMC Dispatch containment work with a weapon harness and tool clips.
  suffix: Containment, WeYu
  components:
  - type: AllowSuitStorage
    whitelist:
      components:
      - Gun
      tags:
      - Stunbaton
      - Radio

# Sealed against what they're there to burn: the containment suit and bio hood, a WY-filtered gas mask
# and MOPP gloves and boots.
- type: startingGear
  id: CMUGearWYBioTechnician
  equipment:
    id: AU14IDCardColonyCorporateLiaison
    jumpsuit: AU14WYPMCFatigues
    outerClothing: CMUSuitBioWeYaContainment
    head: RMCHoodBioWeYa
    mask: CMUMaskGasWYFilled
    gloves: RMCHandsVeteranCBRN
    shoes: RMCBootsCBRN
    ears: RMCHeadsetDistressWeYa
    belt: AU14BeltUtilityFilled
    back: RMCSatchelLightpackWeYa
    suitstorage: RMCWeaponRifleM54C2
    pocket1: RMCPouchMagazineLargePMC
    pocket2: AU14PouchIFAKFill
  storage:
    pocket1:
    - CMMagazineRifleM54CAP
    - CMMagazineRifleM54CAP
    - CMMagazineRifleM54CAP
    - CMMagazineRifleM54CAP
    back:
    - AU14CBRNKitWeYu
    - RMCGeigerCounter
    - CMUGasMaskFilterWY
    - RMCExplosivePlastic
    - RMCExplosivePlastic
    - RMCMREWeYaPMC

