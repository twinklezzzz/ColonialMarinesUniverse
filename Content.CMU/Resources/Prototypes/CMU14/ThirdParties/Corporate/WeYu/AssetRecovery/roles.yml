# WY Asset Recovery Team: PMC Dispatch's retrieval contractors, sent to bring back what a site has lost or
# had taken from it: data, a specimen, a person. Paid on what they bring home. A team leader, two operators,
# a retrieval technician with the capture shotgun and a medic, on the shuttle with the specimen crate.

- type: job
  parent: CMJobBase
  id: CMUJobWYRecoveryLeader
  chevrons:
    CMURankWYPMCTeamLeader:
      entity: CMUChevronWYPMCTeamLeader
      requirements: []
  roundSide: ThirdParty
  roundForce: WY
  roundRole: WYRecoveryLeader
  roundComponents:
  - type: RegulationAppearance # third-party teams keep a regulation look
  - type: NpcFactionMember
    factions:
    - AUWeYu
  - type: Skills
    skills:
      RMCSkillEndurance: 3
      RMCSkillFirearms: 2
      RMCSkillCqc: 2
      RMCSkillFireman: 2
      RMCSkillPolice: 1
      RMCSkillLeadership: 2
      RMCSkillIntel: 2
      RMCSkillMedical: 1
  - type: MarineOrders
  - type: JobPrefix
    prefix: cmu-wyrecovery-prefix-leader
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: pmc_ld
  name: cmu-wyrecovery-name-leader
  description: cmu-wyrecovery-description-leader
  playTimeTracker: CMUJobWYRecoveryLeader
  ranks:
    CMURankWYPMCTeamLeader: []
  startingGear: CMUGearWYRecoveryLeader
  spawnMenuRoleName: WY Asset Recovery Team Leader (3rd party)
  greeting: cmu-wyrecovery-greeting
  icon: "RMCJobIconPMCLeader"
  joinNotifyCrew: false
  supervisors: au14-job-supervisors-wy
  accessGroups:
  - CMUWYSecurity
  - AUPrisonStaff
  access:
  - CMUAccessWYResearch
  - CMUAccessWYArmory
  hidden: false

- type: playTimeTracker
  id: CMUJobWYRecoveryLeader

- type: entity
  parent: AU14BaseMobSpeciesOrganicWeYu
  id: CMUJobWYRecoveryLeader
  name: WY Asset Recovery Team Leader (3rd party)
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: CMUSquadWYSecurity
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: cmu-wyrecovery-name-leader
    description: cmu-wyrecovery-description-leader
    reregister: false
    job: CMUJobWYRecoveryLeader
    raffle:
      settings: short
    rules: cmu-wyrecovery-rules

