# WY Internal Affairs Team: an audit from head office, sent when a site's books, its share price or its
# people don't add up. A senior auditor and an auditor with the authority of the Directorate's Office of
# Internal Affairs, and two Corporate Security officers as their escort. Called in through the corporate
# affairs console, and as easily sent against the people who called it.

- type: job
  parent: CMJobBase
  id: CMUJobWYIASeniorAuditor
  roundSide: ThirdParty
  roundForce: WY
  roundRole: WYIASeniorAuditor
  roundComponents:
  - type: RegulationAppearance # third-party teams keep a regulation look
  - type: NpcFactionMember
    factions:
    - AUWeYu
  - type: Skills
    skills:
      RMCSkillFirearms: 1
      RMCSkillIntel: 2
      RMCSkillPolice: 1
      RMCSkillLeadership: 2
      RMCSkillVehicles: 1
  - type: JobPrefix
    prefix: cmu-wyia-prefix-senior
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: exec_super
  name: cmu-wyia-name-senior
  description: cmu-wyia-description-senior
  playTimeTracker: CMUJobWYIASeniorAuditor
  ranks:
    RMCRankWeYaExecutiveSupervisor: []
  startingGear: CMUGearWYIASeniorAuditor
  spawnMenuRoleName: WY Internal Affairs Senior Auditor (3rd party)
  greeting: cmu-wyia-greeting
  icon: "CMJobIconLiaison"
  joinNotifyCrew: false
  supervisors: cmu-job-supervisors-corporate-directorate
  accessGroups:
  - CMUWYExecutive
  - AUPrisonStaff
  hidden: false

- type: playTimeTracker
  id: CMUJobWYIASeniorAuditor

- type: entity
  parent: AU14BaseMobSpeciesOrganicWeYu
  id: CMUJobWYIASeniorAuditor
  name: WY Internal Affairs Senior Auditor (3rd party)
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: CMUSquadWYCorporate
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: cmu-wyia-name-senior
    description: cmu-wyia-description-senior
    reregister: false
    job: CMUJobWYIASeniorAuditor
    raffle:
      settings: short
    rules: cmu-wyia-rules

