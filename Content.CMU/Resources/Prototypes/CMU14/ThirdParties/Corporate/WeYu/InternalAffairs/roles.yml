# Office clothes, a briefcase of paperwork and a sidearm the auditor hopes not to need.
- type: startingGear
  id: CMUGearWYIAAuditor
  equipment:
    id: CMUIDCardCorporateExecutive
    jumpsuit: CMJumpsuitLiaison
    shoes: RMCShoesLaceup
    ears: AU14ColonyWeylandHeadset
    back: RMCSatchelLightpackBlack
    belt: RMCM77BeltPMCFilled
    pocket1: CMUMobilePhone
  inhand:
  - RMCBriefcasePaperPen
  storage:
    back:
    - CMUGuidebookCorporateHandbook
    - RMCHandcuffs
    - RMCHandcuffs
    - CMCanteen

