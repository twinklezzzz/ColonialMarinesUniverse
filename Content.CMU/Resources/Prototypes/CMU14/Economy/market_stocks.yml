# Company stock, traded only on the civilian app. The listed companies come from the
# Corporations page of the lore guidebook. Norcomm is a UPP state company and Tyrell has
# collapsed, so neither is listed. Smaller companies are thinner markets: a colonist's money
# moves them further.
#
# roundForces ties a company to the jobs that work for it: research income lifts its stock, staff
# deaths drag it down, and setbacks tank it. Any job whose roundForce is listed counts, round-start
# or third party, claimed or not. A company getting its first third party only needs its force here. sectors are its lines of business: when a company in
# the round has a setback in a sector, a rival there that isn't in the round fills the gap.

- type: cmuMarketCommodity
  id: CMUStockWeylandYutani
  kind: Stock
  name: cmu-markets-stock-weyland-yutani
  symbol: WY
  basePrice: 320
  volatility: 0.02
  liquidity: 60000
  roundForces: [WY, WYPMC]
  sectors: [Research, Synthetics, Arms, Colonization]

