# Goods, commodities and services, traded on both the corporate terminal and the civilian app. Prices drift around basePrice each
# market tick by up to volatility, and news events push one commodity for a few ticks. Trades
# move the price too: a trade worth `liquidity` would move it 100%, before the per-trade cap.

- type: cmuMarketCommodity
  id: CMUMarketPhoron
  name: cmu-markets-commodity-phoron
  symbol: PHR
  basePrice: 120
  volatility: 0.04
  liquidity: 25000

