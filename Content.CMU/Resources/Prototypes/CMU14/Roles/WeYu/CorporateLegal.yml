# Round-start corporate legal. Two jobs rather than one ranked job so a map only ever
# has the number of Legal Supervisors the mapper gave it.

# ── Legal Specialist (WYC5L) ────────────────────────────────────────────────
- type: job
  parent: CMJobBase
  id: CMUJobCorporateLegalSpecialist
  roundSide: Civilian
  roundForce: WY
  roundProfiles:
  - AU14RoundJobProfileThirdParty
  roundRole: CivilianCorporateLegalSpecialist
  roundComponents:
  - type: Skills
    skills:
      RMCSkillFireman: 1
      RMCSkillVehicles: 1
      RMCSkillDomestics: 1
      RMCSkillFirearms: 1
      RMCSkillIntel: 1
      RMCSkillPolice: 1
  - type: JobPrefix
    prefix: cmu-job-prefix-corporate-legal-specialist
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: exec_spec
  - type: AssignSquad
    whitelist:
      tags:
      - SquadPMC
  name: cmu-job-name-corporate-legal-specialist
  description: cmu-job-description-corporate-legal-specialist
  setPreference: true
  playTimeTracker: CMUJobCorporateLegalSpecialist
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 18000 # 5 hours
  - !type:TraitsRequirement
    inverted: true
    traits:
    - CMUAlcoholic
    - CMUDrugAddict
  ranks:
    CMURankWeYuLegalSpecialist: []
  startingGear: CMUGearCorporateLegalSpecialist
  icon: "CMJobIconExecSpec"
  requireAdminNotify: false
  joinNotifyCrew: false
  supervisors: cmu-job-supervisors-corporate-legal
  accessGroups:
  - Colonist
  - auadmin
  - AUPrisonStaff
  - auwy
  access:
  - AU14AccessCorporateWEYULiaison
  roleWeight: 0.25

- type: startingGear
  id: CMUGearCorporateLegalSpecialist
  equipment:
    id: CMUIDCardCorporateLegalSpecialist
    jumpsuit: CMJumpsuitLiaisonBlue
    outerClothing: RMCJacketCorporateBlue
    shoes: RMCShoesLaceup
    ears: AU14ColonyWeylandHeadset
    back: CMSatchel
    pocket1: RMCUniversalRecorder
    pocket2: CMClipboard
  inhand:
  - CMUMobilePhone

- type: entity
  parent: CMSpawnPointJobBase
  id: CMUSpawnPointCorporateLegalSpecialist
  name: Spawn Point Corporate Legal Specialist
  components:
  - type: SpawnPoint
    job_id: CMUJobCorporateLegalSpecialist
  - type: Sprite
    state: syn_spawn

- type: playTimeTracker
  id: CMUJobCorporateLegalSpecialist
  isHumanoid: true

- type: roleLoadout
  id: JobCMUJobCorporateLegalSpecialist
  points: 7
  groups:
  - CivSatchelAU14
  - PaperworkRMC
  - WYCLFootwearAU14
  - RecreationalRMC
  - CannedDrinksAU14
  - SmokablesRMC
  - EyewearRMC
  - MasksRMC

