# Weyland-Yutani Overwatch tabs. All three share the WeYa group, so the WY Overwatch console
# shows them side by side. Jobs join them through CMUAssignSquad, which creates the squad on
# first use - nothing else spawns these at round start.

- type: entity
  abstract: true
  parent: SquadBase
  id: CMUSquadWYBase
  components:
  - type: SquadTeam
    color: "#FFAC1C"
    background:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: empty
    blacklistedSquadArmor:
    - Helmet
    - Goggles
    - Armor
    - Gloves
    radio: radioWEYU
    minimapBackground:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_pmc
    canSupplyDrop: false
    group: WeYa
    leaderIcon:
      sprite: _RMC14/Interface/cm_job_icons.rsi
      state: weya_goon_lead

- type: entity
  parent: CMUSquadWYBase
  id: CMUSquadWYCorporate
  name: Corporate

