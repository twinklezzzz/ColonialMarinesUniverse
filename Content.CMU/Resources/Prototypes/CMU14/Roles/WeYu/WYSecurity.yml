    state: syn_spawn

- type: playTimeTracker
  id: CMUJobWYPersonalProtection
  isHumanoid: true

- type: roleLoadout
  id: JobCMUJobWYPersonalProtection
  points: 7
  groups:
  - PaperworkRMC
  - RecreationalRMC
  - CannedDrinksAU14
  - SmokablesRMC

