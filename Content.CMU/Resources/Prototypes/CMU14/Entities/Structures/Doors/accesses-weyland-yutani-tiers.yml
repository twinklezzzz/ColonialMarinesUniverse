# Weyland-Yutani doors by access tier, for the door families mappers use most. Plain
# "Weyland-Yutani, Locked" doors (any WY staff) are in accesses-weyland-yutani.yml.
#   Executive: the Liaison, management and legal (and anyone with Command)
#   Security:  guards and protection details
#   Research:  scientists
#   Armory:    security leadership and site command only
# Executives also hold Security and Research, so they open those doors too. See
# RoundSetup/Access/weyu_access.yml for who holds what.

