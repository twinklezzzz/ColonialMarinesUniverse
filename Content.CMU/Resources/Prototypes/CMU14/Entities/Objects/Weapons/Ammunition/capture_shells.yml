# Weyland-Yutani specimen capture shells. A tranquiliser slug that barely hurts, but stuns and
# slows a xenonid long enough to restrain it. Issued to the Whiteout Dog Catcher.

- type: entity
  parent: CMShellShotgunBase
  id: CMUShellShotgunCapture
  name: handful of capture slugs
  description: Weyland-Yutani tranquiliser slugs for live specimen recovery. 12 gauge.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Handfuls/shotgun_handfuls.rsi
    layers:
    - state: beanbag_slug_1
      map: [ "base" ]
      color: "#9fd8b0"
  - type: CartridgeAmmo
    proto: CMUPelletShotgunCapture
  - type: Stack
    count: 5
    stackType: CMUShellShotgunCapture
    baseLayer: base
    layerStates:
    - beanbag_slug_1
    - beanbag_slug_1
    - beanbag_slug_2
    - beanbag_slug_3
    - beanbag_slug_4
    - beanbag_slug_5
  - type: Tag
    tags:
    - RMCHandful
    - Cartridge
    - RMCShellShotgun
    - CMUShellShotgunCapture

- type: stack
  id: CMUShellShotgunCapture
  name: handful of capture slugs
  icon: { sprite: /Textures/_RMC14/Objects/Weapons/Guns/Ammunition/Handfuls/shotgun_handfuls.rsi, state: beanbag_slug_1 }
  spawn: CMUShellShotgunCapture
  maxCount: 5

- type: Tag
  id: CMUShellShotgunCapture

- type: entity
  parent: CMPelletShotgunBase
  id: CMUPelletShotgunCapture
  name: capture slug
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/shotgun_projectiles.rsi
    layers:
    - state: beanbag
      shader: unshaded
      color: "#9fd8b0"
  - type: Projectile
    damage:
      types:
        Blunt: 5
  - type: RMCStunOnHit
    stuns:
    - whitelist:
        minMobSize: VerySmallXeno
      maxRange: 7
      stunTime: 2.5
      slowTime: 6
      superSlowTime: 3
  - type: RMCStaminaDamageOnCollide
    damage: 45
  - type: RMCProjectileAccuracy
    accuracy: 100

- type: entity
  parent: RMCBoxShotgunBeanbag
  id: CMUBoxShotgunCapture
  name: box of capture slugs
  description: Weyland-Yutani tranquiliser slugs for live specimen recovery. Not for sale. 12 gauge.
  components:
  - type: Storage
    whitelist:
      tags:
      - CMUShellShotgunCapture
  - type: StorageFill
    contents:
    - id: CMUShellShotgunCapture
      amount: 5

- type: entity
  parent: RMCWeaponShotgunXM38
  id: CMUWeaponShotgunXM38Capture
  suffix: Capture
  components:
  - type: BallisticAmmoProvider
    proto: CMUShellShotgunCapture
