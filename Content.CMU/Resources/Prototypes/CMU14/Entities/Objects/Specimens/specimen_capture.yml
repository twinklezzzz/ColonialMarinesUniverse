# Live xenonid capture: capture slugs sedate, the harness binds a downed specimen, and the
# containment bag holds a bound one so it can be hauled. See CMUSpecimenCaptureSystem.

- type: entity
  parent: BaseItem
  id: CMUSpecimenHarness
  name: specimen restraint harness
  description: Reinforced Weyland-Yutani restraint webbing for binding a downed xenonid. Holds for a few minutes before the specimen tears through it, longer if it's bagged.
  components:
  - type: Sprite
    sprite: Objects/Misc/cablecuffs.rsi
    state: cuff
    color: "#9fd8b0"
  - type: Item
    size: Small
  - type: CMUSpecimenHarness

- type: entity
  parent: BaseItem
  id: CMUSpecimenCratePacked
  name: packed specimen crate
  description: A Weyland-Yutani secure specimen crate, packed flat for carrying. Use it on a restrained specimen to crate and seal it, or in hand to set it up empty.
  components:
  - type: Sprite
    sprite: Objects/Devices/flatpack.rsi
    layers:
    - state: base
    - state: overlay
      color: "#9fd8b0"
  - type: Item
    size: Normal # flat-packed, so it fits a satchel
  - type: CMUSpecimenCratePacked
    deployed: CMUSpecimenCrate

# Built on the AEGIS secure crate. Click it to open or close the lid; a specimen can only be
# loaded or let out while it's open.
- type: entity
  parent: BaseStructureDynamic
  id: CMUSpecimenCrate
  name: secure specimen crate
  description: A Weyland-Yutani secure crate, rated for one bound xenonid. Keeps the specimen sedated and secure while it's hauled.
  components:
  - type: Sprite
    sprite: CMU14/Objects/Specimens/specimen_crate.rsi
    layers:
    - state: open
      map: [ "enum.CMUSpecimenCrateLayers.Base" ]
  - type: AnimationPlayer
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 100
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: InteractionOutline
  - type: CMUSpecimenCrate
    packed: CMUSpecimenCratePacked
