# Live xenonid capture: capture slugs sedate, the harness binds a downed specimen, and the
# secure crate holds a bound one so it can be hauled. See CMUSpecimenCaptureSystem.

- type: entity
  parent: BaseItem
  id: CMUSpecimenHarness
  name: specimen restraint harness
  description: Reinforced Weyland-Yutani restraint webbing for binding a downed xenonid. Holds for a few minutes before the specimen tears through it, and it can't work at it while crated.
  components:
  - type: Sprite
    sprite: Objects/Misc/cablecuffs.rsi
    state: cuff
    color: "#9fd8b0"
  - type: Item
    size: Small
  - type: CMUSpecimenHarness

# Built on the AEGIS secure crate. Click it to open or close the lid; a specimen can only be
# loaded or let out while it's open.
- type: entity
  parent: BaseStructureDynamic
  id: CMUSpecimenCrate
  name: secure specimen crate
  description: A Weyland-Yutani secure crate, rated for one bound xenonid. Keeps the specimen sedated and secure while it's hauled.
  components:
  - type: Sprite
    sprite: CMU14/Objects/Specimens/specimen_crate.rsi
    layers:
    - state: open
      map: [ "enum.CMUSpecimenCrateLayers.Base" ]
  - type: AnimationPlayer
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 100
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: InteractionOutline
  - type: CMUSpecimenCrate

# Map this onto the Whiteout shuttle; it puts an empty, open crate there when the shuttle loads.
- type: entity
  parent: MarkerBase
  id: CMUSpawnSpecimenCrate
  name: secure specimen crate spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: CMU14/Objects/Specimens/specimen_crate.rsi
      state: open
  - type: ConditionalSpawner
    prototypes:
    - CMUSpecimenCrate
