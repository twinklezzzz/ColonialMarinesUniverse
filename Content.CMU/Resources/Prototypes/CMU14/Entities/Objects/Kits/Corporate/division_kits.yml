# Division kits for the Division Manager (WYC8). Each division can be claimed once per vendor;
# claiming one also adds the division to the manager's title and radio prefix.

- type: entity
  parent: AU14KitPlatoonOfficer
  id: CMUKitCorporateDivisionSpecialServices
  name: Special Services division kit
  description: Covert work, internal investigations and anything the company would rather not put in writing.
  components:
  - type: StorageFill
    contents:
    - id: RMCPouchDocument
    - id: RMCIntelDetector
    - id: RMCUniversalRecorder
    - id: RMCBinocularsPVE
    - id: RMCFlashlight

- type: entity
  parent: AU14KitPlatoonOfficer
  id: CMUKitCorporateDivisionCorporateRelations
  name: Corporate Relations division kit
  description: Third parties, trade partners and the company's public face on the colony.
